<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily Bugle - Puzzle Event</title>
    <link rel="stylesheet" href="style.css?v=10">

    <!-- =================================================================
         PAGE 1 (INTRO) CONFIGURATION
    ================================================================== -->
    <script>
        const PUZZLE_CONFIG = {
            puzzleId: "intro",
            pageNumber: "Page 1",
            dateText: "Dec 12, 2026",
            editionText: "CONLINE EDITION",
            bannerImage: "Daily_Bugle_Large.jpg",
            
            // Headline & Sub-headline
            headline: "Jameson offers reward for Spider-Man's True Identity!",
            subHeadline: "Villains line up to collect bounty from prestigious publisher",
            
            // Left Column Flavor Text
            leadParagraph: "That's right, New York City! Now that the Daily Bugle has finally moved online, it's time to take this nefarious Spider-Man business seriously. We are crowdsourcing the unveiling of this dangerous threat to our streets. I, J Jonah Jameson, your illustrious publisher and editor-in-chief am offering a reward for anyone who can provide definitive proof of the masked menace's real identity.",
            
            // Welcome Box Content
            boxHeading: "Conline Mini-Extravaganza 2026",
            boxParagraphs: [
                "Welcome to the Conline Mini-Extravaganza! As you can see, the Daily Bugle has finally embraced new media, and its annoyance-in-chief, J Jonah Jameson is going after Spider-Man again! Five of Spider-Man's villains have quickly taken up the challenge. Let's use our puzzling skills to see what these five are up to and discover Spider-Man's fate. You will find five clickable individual villain puzzles in the sidebar to the right (or below). When you have solved all five, you will be presented with a final puzzle.",
                "On every page, you will find your puzzle text in a white box like this one, with a submission box in white below the puzzle. Everything else on the page may be treated as flavor."
            ],
            
            // Sidebar Exposé
            sidebarSubjectName: "J Jonah Jameson",
            sidebarSubjectImage: "jameson.jpg"
        };
    </script>
</head>
<body>

<div class="newspaper-container">

    <!-- Top Image Banner -->
    <header class="bugle-header">
        <img id="cfg-banner-img" src="" alt="The Daily Bugle" class="bugle-banner-img">
    </header>

    <!-- Metadata Bar -->
    <div class="news-meta">
        <span id="cfg-date"></span>
        <span id="cfg-edition"></span>
        <span id="cfg-page-num"></span>
    </div>

    <!-- Main Headline Section -->
    <section class="main-story">
        <h1 class="main-headline" id="cfg-headline"></h1>
        <h2 class="sub-headline" id="cfg-subheadline"></h2>
    </section>

    <!-- Two-Column Layout -->
    <div class="puzzle-grid">

        <!-- Left Column: Intro Story & Welcome Box (No Puzzle/Submission Box) -->
        <div class="left-column">
            <div class="puzzle-body">
                <p id="cfg-lead-paragraph"></p>
            </div>

            <div class="puzzle-box">
                <h3 class="sidebar-heading" id="cfg-box-heading"></h3>
                <div id="cfg-box-body"></div>
            </div>
        </div>


        <!-- Right Column: Exposé Portrait & Read More Navigation -->
        <aside class="right-column">
            <h3 class="sidebar-heading" id="cfg-villain-heading">Expos&eacute;!</h3>
            <div style="text-align: center; margin-bottom: 15px;">
                <img id="cfg-villain-img" src="" alt="">
                <strong id="cfg-sidebar-name"></strong>
            </div>

            <h3 class="sidebar-heading">Read more!</h3>
            <ul style="list-style: none; padding: 0; margin: 10px 0 20px 0; font-size: 14px;">
                <li><a href="spiderhunt_intro.html" style="color: #111;">Page 1: Intro</a> <span id="status-intro"></span></li>
                <li><a href="spiderhunt_shriek.html" style="color: #111;">Page 2: Shriek</a> <span id="status-shriek"></span></li>
                <li><a href="spiderhunt_kraven.html" style="color: #111;">Page 3: Kraven</a> <span id="status-kraven"></span></li>
                <li><a href="spiderhunt_negative.html" style="color: #111;">Page 4: Mr. Negative</a> <span id="status-negative"></span></li>
                <li><a href="spiderhunt_docock.html" style="color: #111;">Page 5: Doc Ock</a> <span id="status-docock"></span></li>
                <li><a href="spiderhunt_chameleon.html" style="color: #111;">Page 6: Chameleon</a> <span id="status-chameleon"></span></li>
                <li><a href="hunting_for_spiders.html" style="color: #111;">Page 7: Hunting for Spiders</a> <span id="status-final"></span></li>
            </ul>
        </aside>

    </div>
</div>

<script>
    const SEQUENTIAL_LOCK = false;

    function applyIntroConfig() {
        document.getElementById("cfg-banner-img").src = PUZZLE_CONFIG.bannerImage;
        document.getElementById("cfg-date").textContent = PUZZLE_CONFIG.dateText;
        document.getElementById("cfg-edition").textContent = PUZZLE_CONFIG.editionText;
        document.getElementById("cfg-page-num").textContent = PUZZLE_CONFIG.pageNumber;
        document.getElementById("cfg-headline").textContent = PUZZLE_CONFIG.headline;
        document.getElementById("cfg-subheadline").textContent = PUZZLE_CONFIG.subHeadline;

        document.getElementById("cfg-lead-paragraph").textContent = PUZZLE_CONFIG.leadParagraph;
        document.getElementById("cfg-box-heading").textContent = PUZZLE_CONFIG.boxHeading;

        const boxBody = document.getElementById("cfg-box-body");
        boxBody.innerHTML = PUZZLE_CONFIG.boxParagraphs.map(function(text) {
            return "<p>" + text + "</p>";
        }).join("");

        document.getElementById("cfg-villain-heading").textContent = "Expos\u00E9!";
        const subjectImg = document.getElementById("cfg-villain-img");
        subjectImg.src = PUZZLE_CONFIG.sidebarSubjectImage;
        subjectImg.alt = PUZZLE_CONFIG.sidebarSubjectName;
        document.getElementById("cfg-sidebar-name").textContent = PUZZLE_CONFIG.sidebarSubjectName;
    }

    function getSolvedAnswer(id) {
        return localStorage.getItem("spiderhunt_solved_" + id) || localStorage.getItem("bugle_solved_" + id);
    }

    function updateSidebarProgress() {
        // 1. Page 1: Intro is always marked as [📖 READ] upon visiting
        localStorage.setItem("spiderhunt_intro_read", "true");
        const introEl = document.getElementById("status-intro");
        if (introEl) {
            introEl.textContent = "[📖 READ]";
            introEl.style.color = "#666666";
            introEl.style.fontSize = "12px";
            introEl.style.fontWeight = "bold";
        }

        // 2. Pages 2-6: Villain statuses
        const villains = ["shriek", "kraven", "negative", "docock", "chameleon"];
        let allVillainsSolved = true;

        villains.forEach(function(id, index) {
            const el = document.getElementById("status-" + id);
            if (!el) return;

            const linkEl = el.parentElement ? el.parentElement.querySelector("a") : null;
            const solvedVal = getSolvedAnswer(id);

            let isUnlocked = true;
            if (SEQUENTIAL_LOCK && index > 0) {
                const prevId = villains.at(index - 1);
                isUnlocked = Boolean(getSolvedAnswer(prevId));
            }

            el.style.fontSize = "12px";
            el.style.fontWeight = "bold";

            if (solvedVal) {
                el.textContent = "[✅ SOLVED]";
                el.style.color = "#155724";
            } else if (isUnlocked) {
                allVillainsSolved = false;
                el.textContent = "[🔓 UNLOCKED]";
                el.style.color = "#666666";
            } else {
                allVillainsSolved = false;
                el.textContent = "[🔒 LOCKED]";
                el.style.color = "#888888";
                if (linkEl) {
                    linkEl.style.pointerEvents = "none";
                    linkEl.style.color = "#888888";
                    linkEl.style.textDecoration = "none";
                }
            }
        });

        // 3. Page 7: Final Hunt status
        const finalEl = document.getElementById("status-final");
        if (finalEl) {
            const finalLink = finalEl.parentElement ? finalEl.parentElement.querySelector("a") : null;
            const finalSolved = Boolean(getSolvedAnswer("final"));

            finalEl.style.fontSize = "12px";
            finalEl.style.fontWeight = "bold";

            if (finalSolved) {
                finalEl.textContent = "[✅ SOLVED]";
                finalEl.style.color = "#155724";
            } else if (allVillainsSolved) {
                finalEl.textContent = "[🔓 UNLOCKED]";
                finalEl.style.color = "#666666";
            } else {
                finalEl.textContent = "[🔒 LOCKED]";
                finalEl.style.color = "#888888";
                if (finalLink) {
                    finalLink.style.pointerEvents = "none";
                    finalLink.style.color = "#888888";
                    finalLink.style.textDecoration = "none";
                }
            }
        }
    }

    applyIntroConfig();
    updateSidebarProgress();
</script>

</body>
</html>
