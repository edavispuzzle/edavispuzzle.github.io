<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bugle - Villain Word Ladders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="raddle-embed">

<div class="raddle-instructions">
    <strong>HOW TO PLAY:</strong> Click a villain portrait below to open their clue ladder. Solve the <strong>START</strong> clue first, then use the alphabetical clues on the right to step down the chain. Thanks and credit for puzzle type/presentation to Sandy Weisz and raddle.quest!
</div>
<div class="villain-tabs" id="villain-tabs"></div>
<div class="active-workspace" id="active-workspace"></div>

<script>
    const PUZZLES = [
                {
            id: "chameleon",
            title: "Chameleon",
            image: "chameleon.jpg",
		prevAnswer: "RED PANDA",

            steps: [
                { answer: "FIREFOX", clue: "What is CHAMELEON using to try and look up Spider-man's identity?" },
                { answer: "RED FOX", clue: "Change the first four letters of <FIRST> to a color that commonly represents them" },
                { answer: "REDD FOXX", clue: "Add a different letter to the end of each of word in <FIRST> to get a comedian" },
                { answer: "SANFORD", clue: "_______ is <FIRST>'s real last name, and the name of his most famous character" },
                { answer: "FORD", clue: "Remove the first three letters of <FIRST> to get a vehicle" },
                { answer: "NIXON", clue: "_______ is the President before <FIRST>" },
                { answer: "NEON", clue: "Replace the longest Roman numeral in <FIRST> with an \"E\"" },
                { answer: "NEO", clue: "Drop the last letter in <FIRST> to get a sci-fi movie character" },
                { answer: "NEW", clue: "<FIRST> is a prefix, meaning _________." }
            ]
        },
{
            id: "kraven",
            title: "Kraven",
            image: "kraven.jpg",
	prevAnswer: "BIG GAME",
            steps: [
                { answer: "SAFARI", clue: "What is KRAVEN using to try and look up Spider-man's identity?" },
                { answer: "AFRICA", clue: "The continent you might visit for a <FIRST>" },
                { answer: "TOTO", clue: "The band famous for <FIRST>" },
                { answer: "DOROTHY", clue: "<FIRST>'s human friend" },
                { answer: "DOT", clue: "_______ is a nickname for <FIRST>" },
                { answer: "DASH", clue: "The opposite of <FIRST>, especially here" },
                { answer: "TEASPOON", clue: "Eight times <FIRST>" },
                { answer: "TSP", clue: "The common abbreviation for <FIRST>" },
                { answer: "FEB", clue: "<FIRST>, Caesar-shifted 12 letters" },
                { answer: "DAY", clue: "<FIRST> contains fewer of one of these than it's counterparts" },
                { answer: "DAILY", clue: "The adjective for something that occurs once every <FIRST>" }
            ]
        },
       {
            id: "docock",
            title: "Doc Ock",
            image: "docock.jpg",
prevAnswer: "METALLIC",
            steps: [
                { answer: "CHROME", clue: "What is DOC OCK using to try and look up Spider-man's identity?" },
                { answer: "ITALY", clue: "The last four letters of <FIRST> are the capital of _______" },
                { answer: "CIAO", clue: "How one says goodbye in <FIRST>" },
                { answer: "CHOW", clue: "A common homophone of <FIRST>" },
                { answer: "MUNCH", clue: "A synonym of <FIRST> that rhymes with one of three major times ones might do it" },
                { answer: "THE SCREAM", clue: "<FIRST>'s most famous work" },
                { answer: "SHRIEK", clue: "A synonym of <FIRST> that happens to be one of the other Villains" },
                { answer: "SHREK", clue: "Remove a letter from <FIRST> to get a movie character" },
                { answer: "OGRE", clue: "<FIRST> is a _______" },
                { answer: "OGLE", clue: "Change the third letter of <FIRST> to get a verb with a sinful connotation" },
                { answer: "GOOGLE", clue: "Prepend the first two letters of <FIRST> back onto <FIRST>" }
            ]
        },
{
            id: "shriek",
            title: "Shriek",
            image: "shriek.jpg",
            prevAnswer: "HIGH NOTE",
steps: [
                { answer: "OPERA", clue: "What is SHRIEK using to try and look up Spider-man's identity?" },
                { answer: "OPERATION", clue: "Append four letters to <FIRST> to get the name of a board game" },
                { answer: "CAVITY", clue: "The first name of the only character in <FIRST>" },
                { answer: "TOOTH", clue: "Where one might commonly experience a <FIRST>" },
                { answer: "TOOT", clue: "Remove the last letter from <FIRST>" },
                { answer: "ROOT", clue: "Change the first letter of <FIRST> to an \"r\" to get a word with at least two very different meanings" },
                { answer: "BEER", clue: "<FIRST> _______ is a common beverage" },
                { answer: "BREW", clue: "What one does to make <FIRST>" },
                { answer: "WEB", clue: "Remove the second letter of <FIRST> and reverse the rest" }
            ]
        },

{
            id: "negative",
            title: "Mr. Negative",
            image: "mrnegative.jpg",
            prevAnswer: "FRINGE",
steps: [
                { answer: "EDGE", clue: "What is MR. NEGATIVE using to try and look up Spider-man's identity?" },
                { answer: "HEDGE", clue: "Prepend a new letter onto <FIRST> to get something trimmable" },
                { answer: "MAZE", clue: "A common puzzle word that most commonly follows <FIRST>" },
                { answer: "PRAISE", clue: "Change the starting phoneme of <FIRST> to \"pr\" to make an appreciative word" },
                { answer: "REVERE", clue: "A synonym of <FIRST> that is also a famous last name in US History" },
                { answer: "REDCOAT", clue: "The kind of garment associated with <FIRST>'s words" },
                { answer: "ART DECO", clue: "A fashionable transposal of <FIRST>" },
                { answer: "ZYDECO", clue: "Replace the first three letters of <FIRST> with two new letters and get ready to dance" },
                { answer: "ZODIAC", clue: "A consonantcy of <FIRST>" },
                { answer: "SIGN", clue: "The most common word to follow <FIRST>" },
                { answer: "DESIGNER", clue: "Surround <FIRST> with a four letter mammal to create a profession" }
            ]
        }
    ];
    let activePuzzleId = PUZZLES.at(0).id;
    const puzzleState = {};

    function initPuzzles() {
        PUZZLES.forEach(function(puzzle) {
            const remaining = puzzle.steps.map(function(_, idx) { return idx; }).slice(1);
            const sorted = remaining.sort(function(a, b) {
                const clueA = puzzle.steps.at(a).clue.replace(/<FIRST>/gi, "").trim().toLowerCase();
                const clueB = puzzle.steps.at(b).clue.replace(/<FIRST>/gi, "").trim().toLowerCase();
                return clueA.localeCompare(clueB);
            });
            puzzleState[puzzle.id] = {
                currentStepIndex: 0,
                solvedWords: [],
                clueOrder: Array.of(0).concat(sorted),
                selectedClueStepIndex: 0,
                feedback: "",
                feedbackType: ""
            };
        });
        renderAll();
    }

    function switchTab(puzzleId) {
        activePuzzleId = puzzleId;
        renderAll();
        const inputEl = document.getElementById("active-entry-input");
        if (inputEl) inputEl.focus();
    }

    function renderAll() {
        renderTabs();
        renderActiveWorkspace();
    }

    function renderTabs() {
        const tabsContainer = document.getElementById("villain-tabs");
        if (!tabsContainer) return;

        tabsContainer.innerHTML = PUZZLES.map(function(puzzle) {
            const state = puzzleState[puzzle.id];
            const isActive = puzzle.id === activePuzzleId;
            const isComplete = state.currentStepIndex >= puzzle.steps.length;
            const statusText = isComplete ? escapeHtml(state.solvedWords.at(-1)) : state.currentStepIndex + " / " + puzzle.steps.length;

            return '<button type="button" class="villain-tab-btn ' + (isActive ? "active-tab " : "") + (isComplete ? "solved-tab" : "") + '" onclick="switchTab(\'' + puzzle.id + '\')">' +
                '<div class="tab-villain-name">' + escapeHtml(puzzle.title) + '</div>' +
                '<img src="' + escapeHtml(puzzle.image) + '" alt="' + escapeHtml(puzzle.title) + '" class="tab-villain-img" />' +
                '<div class="tab-prev-answer">' + escapeHtml(puzzle.prevAnswer) + '</div>' +
                '<div class="tab-status-badge">' + statusText + '</div>' +
            '</button>';
        }).join("");
    }

    function renderActiveWorkspace() {
        const workspace = document.getElementById("active-workspace");
        if (!workspace) return;

        const puzzle = PUZZLES.find(function(p) { return p.id === activePuzzleId; });
        const state = puzzleState[puzzle.id];
        const isComplete = state.currentStepIndex >= puzzle.steps.length;
        const currentTopWord = state.solvedWords.length > 0 ? state.solvedWords.at(-1) : "?";

        let ladderHtml = "";
        if (state.solvedWords.length > 0) {
            const items = state.solvedWords.map(function(word, idx) {
                let cls = idx === 0 ? "start-word" : (isComplete && idx === state.solvedWords.length - 1 ? "final-word" : (idx === state.solvedWords.length - 1 ? "latest-word" : ""));
                return '<div class="ladder-word ' + cls + '">' + escapeHtml(word) + '</div>';
            }).join("");
            ladderHtml = '<div class="ladder-stack">' + items + '</div>';
        }

        let entryHtml = "";
        if (!isComplete) {
            const len = puzzle.steps.at(state.currentStepIndex).answer.replace(/\s+/g, "").length;
            const placeholder = len + (len === 1 ? " letter" : " letters");
            const fbClass = state.feedbackType === "error" ? "feedback-error" : "feedback-success";
            entryHtml = '<form class="entry-form" onsubmit="handleGuess(event)"><input type="text" class="entry-input" id="active-entry-input" placeholder="' + placeholder + '" autocomplete="off" /><button type="submit" class="entry-btn">Go</button></form><div class="feedback-msg ' + fbClass + '">' + escapeHtml(state.feedback) + '</div>';
        } else {
            entryHtml = '<div class="solved-banner">CHAIN COMPLETE!</div>';
        }

        let cluesPanelHtml = "";
        if (!isComplete) {
            const remaining = state.clueOrder.filter(function(idx) { return idx >= state.currentStepIndex; });
            if (!remaining.includes(state.selectedClueStepIndex)) state.selectedClueStepIndex = remaining.at(0);

            const clueButtons = remaining.map(function(stepIdx) {
                const formatted = escapeHtml(puzzle.steps.at(stepIdx).clue).replace(/&lt;FIRST&gt;/gi, '<span class="first-token">' + escapeHtml(currentTopWord) + '</span>');
                const sel = stepIdx === state.selectedClueStepIndex ? "selected-clue" : "";
                const badge = stepIdx === 0 ? '<span class="first-token" style="margin-right: 6px;">START</span>' : "";
                return '<button type="button" class="clue-item ' + sel + '" onclick="selectClue(' + stepIdx + ')">' + badge + formatted + '</button>';
            }).join("");

            cluesPanelHtml = '<div class="clues-panel"><div class="panel-label">Available Clues (' + remaining.length + ' remaining)</div>' + clueButtons + '</div>';
        } else {
            cluesPanelHtml = '<div class="clues-panel"><div class="panel-label">Case File Closed</div><div style="padding:15px;background:#fff;border:1px solid #ccc;font-size:14px;">All steps for <strong>' + escapeHtml(puzzle.title) + '</strong> solved! Click another villain portrait above to continue.</div></div>';
        }

        workspace.innerHTML =
            '<div class="workspace-header"><span>' + escapeHtml(puzzle.title) + ' — Word Chain</span><span>Progress: ' + state.currentStepIndex + ' / ' + puzzle.steps.length + '</span></div>' +
            '<div class="workspace-body"><div class="ladder-panel"><div class="panel-label">Word Ladder</div>' + ladderHtml + entryHtml + '</div>' + cluesPanelHtml + '</div>';
    }

    function selectClue(stepIdx) {
        puzzleState[activePuzzleId].selectedClueStepIndex = stepIdx;
        puzzleState[activePuzzleId].feedback = "";
        renderActiveWorkspace();
        const inputEl = document.getElementById("active-entry-input");
        if (inputEl) inputEl.focus();
    }

    function handleGuess(event) {
        event.preventDefault();
        const puzzle = PUZZLES.find(function(p) { return p.id === activePuzzleId; });
        const state = puzzleState[activePuzzleId];
        const inputEl = document.getElementById("active-entry-input");
        if (!inputEl) return;

        const guess = inputEl.value.trim().toUpperCase();
        if (!guess) return;

        const expected = puzzle.steps.at(state.currentStepIndex).answer.trim().toUpperCase();
        if (guess === expected) {
            state.solvedWords.push(expected);
            state.currentStepIndex += 1;
            state.feedback = "Correct!";
            state.feedbackType = "success";
            renderAll();
            const nextInput = document.getElementById("active-entry-input");
            if (nextInput) nextInput.focus();
        } else {
            state.feedback = '"' + guess + '" is not the next word.';
            state.feedbackType = "error";
            renderActiveWorkspace();
            const retryInput = document.getElementById("active-entry-input");
            if (retryInput) { retryInput.value = guess; retryInput.select(); }
        }
    }

    function escapeHtml(str) {
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    initPuzzles();
</script>
</body>
</html>
