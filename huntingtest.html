    let activePuzzleId = PUZZLES.at(0).id;
    const puzzleState = {};

    function initPuzzles() {
        PUZZLES.forEach(function(puzzle) {
            const remaining = puzzle.steps.map(function(_, idx) { return idx; }).slice(1);
            const sorted = remaining.sort(function(a, b) {
                const clueA = puzzle.steps.at(a).clue.replace(/<FIRST>/gi, "").trim().toLowerCase();
                const clueB = puzzle.steps.at(b).clue.replace(/<FIRST>/gi, "").trim().toLowerCase();
                return clueA.localeCompare(clueB);
            });
            puzzleState[puzzle.id] = {
                currentStepIndex: 0,
                solvedWords: [],
                clueOrder: Array.of(0).concat(sorted),
                selectedClueStepIndex: 0,
                feedback: "",
                feedbackType: ""
            };
        });
        renderAll();
    }

    function switchTab(puzzleId) {
        activePuzzleId = puzzleId;
        renderAll();
        const inputEl = document.getElementById("active-entry-input");
        if (inputEl) inputEl.focus();
    }

    function renderAll() {
        renderTabs();
        renderActiveWorkspace();
    }

    function renderTabs() {
        const tabsContainer = document.getElementById("villain-tabs");
        if (!tabsContainer) return;

        tabsContainer.innerHTML = PUZZLES.map(function(puzzle) {
            const state = puzzleState[puzzle.id];
            const isActive = puzzle.id === activePuzzleId;
            const isComplete = state.currentStepIndex >= puzzle.steps.length;
            const statusText = isComplete ? escapeHtml(state.solvedWords.at(-1)) : state.currentStepIndex + " / " + puzzle.steps.length;

            return '<button type="button" class="villain-tab-btn ' + (isActive ? "active-tab " : "") + (isComplete ? "solved-tab" : "") + '" onclick="switchTab(\'' + puzzle.id + '\')">' +
                '<div class="tab-villain-name">' + escapeHtml(puzzle.title) + '</div>' +
                '<img src="' + escapeHtml(puzzle.image) + '" alt="' + escapeHtml(puzzle.title) + '" class="tab-villain-img" />' +
                '<div class="tab-prev-answer">' + escapeHtml(puzzle.prevAnswer) + '</div>' +
                '<div class="tab-status-badge">' + statusText + '</div>' +
            '</button>';
        }).join("");
    }

    function renderActiveWorkspace() {
        const workspace = document.getElementById("active-workspace");
        if (!workspace) return;

const allPuzzlesSolved = PUZZLES.every(function(p) {
            const st = puzzleState[p.id];
            return st && st.currentStepIndex >= p.steps.length;
        });

        if (allPuzzlesSolved) {
            workspace.innerHTML =
                '<div class="workspace-header">' +
                    '<span>CASE CLOSED — ALL CHAINS COMPLETE</span>' +
                    '<span>5 / 5 SOLVED</span>' +
                '</div>' +
                '<div class="victory-ending-box">' +
                    '<h2 class="victory-headline">EXTRA! EXTRA! SPIDER-HUNT SOLVED!</h2>' +
                    '<p class="victory-text">Congratulations! You have cracked all five villain word ladders and uncovered every clue across the Daily Bugle.</p>' +
                    '<p class="victory-subtext">Thanks for playing!</p>' +
                '</div>';
            return;
        }

        const puzzle = PUZZLES.find(function(p) { return p.id === activePuzzleId; });
        const state = puzzleState[puzzle.id];
        const isComplete = state.currentStepIndex >= puzzle.steps.length;
        const currentTopWord = state.solvedWords.length > 0 ? state.solvedWords.at(-1) : "?";

        let ladderHtml = "";
        if (state.solvedWords.length > 0) {
            const items = state.solvedWords.map(function(word, idx) {
                let cls = idx === 0 ? "start-word" : (isComplete && idx === state.solvedWords.length - 1 ? "final-word" : (idx === state.solvedWords.length - 1 ? "latest-word" : ""));
                return '<div class="ladder-word ' + cls + '">' + escapeHtml(word) + '</div>';
            }).join("");
            ladderHtml = '<div class="ladder-stack">' + items + '</div>';
        }

        let entryHtml = "";
        if (!isComplete) {
            const len = puzzle.steps.at(state.currentStepIndex).length;

            const placeholder = len + (len === 1 ? " letter" : " letters");
            const fbClass = state.feedbackType === "error" ? "feedback-error" : "feedback-success";
            entryHtml = '<form class="entry-form" onsubmit="handleGuess(event)"><input type="text" class="entry-input" id="active-entry-input" placeholder="' + placeholder + '" autocomplete="off" /><button type="submit" class="entry-btn">Go</button></form><div class="feedback-msg ' + fbClass + '">' + escapeHtml(state.feedback) + '</div>';
        } else {
            entryHtml = '<div class="solved-banner">CHAIN COMPLETE!</div>';
        }

        let cluesPanelHtml = "";
        if (!isComplete) {
            const remaining = state.clueOrder.filter(function(idx) { return idx >= state.currentStepIndex; });
            if (!remaining.includes(state.selectedClueStepIndex)) state.selectedClueStepIndex = remaining.at(0);

            const clueButtons = remaining.map(function(stepIdx) {
                const formatted = escapeHtml(puzzle.steps.at(stepIdx).clue).replace(/&lt;FIRST&gt;/gi, '<span class="first-token">' + escapeHtml(currentTopWord) + '</span>');
                const sel = stepIdx === state.selectedClueStepIndex ? "selected-clue" : "";
                const badge = stepIdx === 0 ? '<span class="first-token" style="margin-right: 6px;">START</span>' : "";
                return '<button type="button" class="clue-item ' + sel + '" onclick="selectClue(' + stepIdx + ')">' + badge + formatted + '</button>';
            }).join("");

            cluesPanelHtml = '<div class="clues-panel"><div class="panel-label">Available Clues (' + remaining.length + ' remaining)</div>' + clueButtons + '</div>';
        } else {
            cluesPanelHtml = '<div class="clues-panel"><div class="panel-label">Case File Closed</div><div style="padding:15px;background:#fff;border:1px solid #ccc;font-size:14px;">All steps for <strong>' + escapeHtml(puzzle.title) + '</strong> solved! Click another villain portrait above to continue.</div></div>';
        }

        workspace.innerHTML =
            '<div class="workspace-header"><span>' + escapeHtml(puzzle.title) + ' — Word Chain</span><span>Progress: ' + state.currentStepIndex + ' / ' + puzzle.steps.length + '</span></div>' +
            '<div class="workspace-body"><div class="ladder-panel"><div class="panel-label">Word Ladder</div>' + ladderHtml + entryHtml + '</div>' + cluesPanelHtml + '</div>';
    }

    function selectClue(stepIdx) {
        puzzleState[activePuzzleId].selectedClueStepIndex = stepIdx;
        puzzleState[activePuzzleId].feedback = "";
        renderActiveWorkspace();
        const inputEl = document.getElementById("active-entry-input");
        if (inputEl) inputEl.focus();
    }

    async function handleGuess(event) {
        event.preventDefault();
        const puzzle = PUZZLES.find(function(p) { return p.id === activePuzzleId; });
        const state = puzzleState[activePuzzleId];
        const inputEl = document.getElementById("active-entry-input");
        if (!inputEl) return;

        const guess = inputEl.value.trim().toUpperCase();
        if (!guess) return;

        const guessHash = await sha256(guess);
        const expectedHash = puzzle.steps.at(state.currentStepIndex).answerHash;

        if (guessHash === expectedHash) {
            state.solvedWords.push(guess);
            state.currentStepIndex += 1;
            state.feedback = "Correct!";
            state.feedbackType = "success";
            renderAll();

            const nextInput = document.getElementById("active-entry-input");
            if (nextInput) nextInput.focus();
        } else {
            state.feedback = '"' + guess + '" is not the next word.';
            state.feedbackType = "error";
            renderActiveWorkspace();
            const retryInput = document.getElementById("active-entry-input");
            if (retryInput) {
                retryInput.value = guess;
                retryInput.select();
            }
        }
    }
   async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(function(b) {
            return b.toString(16).padStart(2, "0");
        }).join("");
    }
    function escapeHtml(str) {
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    initPuzzles();
</script>
